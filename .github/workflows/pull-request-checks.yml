name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Android navigation, updater, and restock regression tests
        run: npx playwright test tests/e2e/android-back-update.spec.ts tests/e2e/restock-recommendations.spec.ts

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compile Android Java
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew compileDebugJavaWithJavac
