name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Barcode parser test
        continue-on-error: true
        run: npx playwright test tests/e2e/scanner-barcode.spec.ts --grep "custom barcode parser"

      - name: Scanner all-results and voice test
        continue-on-error: true
        run: npx playwright test tests/e2e/scanner-barcode.spec.ts --grep "scanner exposes every"

      - name: Custom barcode manager test
        continue-on-error: true
        run: npx playwright test tests/e2e/scanner-barcode.spec.ts --grep "barcode manager saves"

      - name: Factory barcode test
        continue-on-error: true
        run: npx playwright test tests/e2e/scanner-barcode.spec.ts --grep "factory barcode accepts"

      - name: Thermal printer tests
        continue-on-error: true
        run: npx playwright test tests/e2e/thermal-printer.spec.ts

      - name: Shopping, release notes, report tests
        continue-on-error: true
        run: npx playwright test tests/e2e/shopping-release-report.spec.ts

      - name: Existing critical regressions
        continue-on-error: true
        run: npx playwright test tests/e2e/android-back-update.spec.ts tests/e2e/android-native-fixes.spec.ts tests/e2e/restock-recommendations.spec.ts tests/e2e/voice-guide.spec.ts tests/e2e/guide.spec.ts

      - name: Sync Capacitor Android
        if: always()
        run: npx cap sync android

      - name: Android ESC/POS unit tests and debug APK build
        if: always()
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew testDebugUnitTest assembleDebug
