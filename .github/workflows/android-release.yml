name: Android Release

on:
  push:
    branches:
      - main
      - feat/qris-dynamic-midtrans
    tags:
      - 'v*'
    paths-ignore:
      - 'public/app-update.json'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Prepare signing and version
        env:
          KEYSTORE_BASE64: ${{ secrets.AB_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AB_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AB_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AB_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "AB_RELEASE_KEYSTORE_BASE64 belum di-set" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "AB_RELEASE_STORE_PASSWORD belum di-set" && exit 1)
          test -n "$KEY_ALIAS" || (echo "AB_RELEASE_KEY_ALIAS belum di-set" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "AB_RELEASE_KEY_PASSWORD belum di-set" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ab-release.keystore"
          echo "AB_RELEASE_STORE_FILE=$RUNNER_TEMP/ab-release.keystore" >> "$GITHUB_ENV"
          echo "AB_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AB_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AB_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            BASE_VERSION=$(node -p "require('./package.json').version")
            if [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              VERSION_NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-commit.${GITHUB_RUN_NUMBER}"
            else
              echo "Versi package.json harus berbentuk major.minor.patch" && exit 1
            fi
          fi
          echo "AB_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "AB_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build web and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build signed APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/ABElektronik-Inventory.apk
          cd release
          sha256sum ABElektronik-Inventory.apk > ABElektronik-Inventory.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            extra_args=""
            if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
              extra_args="--prerelease"
            fi
            gh release create "$GITHUB_REF_NAME" \
              release/ABElektronik-Inventory.apk \
              release/ABElektronik-Inventory.apk.sha256 \
              --verify-tag \
              --title "ABElektronik Inventory ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              $extra_args
          else
            gh release create "v$AB_VERSION_NAME" \
              release/ABElektronik-Inventory.apk \
              release/ABElektronik-Inventory.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "ABElektronik Inventory $AB_VERSION_NAME" \
              --notes "APK update otomatis dari commit $GITHUB_SHA pada branch $GITHUB_REF_NAME." \
              --prerelease
          fi

      - name: Publish app update feed
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_FEED_BRANCH: feat/qris-dynamic-midtrans
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v$AB_VERSION_NAME"
          fi
          RELEASE_DATA=$(gh release view "$RELEASE_TAG" --json name,body,publishedAt)
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/ABElektronik-Inventory.apk"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"

          git fetch origin "$UPDATE_FEED_BRANCH"
          git checkout -B "$UPDATE_FEED_BRANCH" "origin/$UPDATE_FEED_BRANCH"
          mkdir -p public
          printf '%s' "$RELEASE_DATA" | jq \
            --arg version "$AB_VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            --arg releaseUrl "$RELEASE_URL" \
            '{version:$version,title:(.name // ("ABElektronik Inventory " + $version)),body:(.body // ""),apkUrl:$apkUrl,releaseUrl:$releaseUrl,publishedAt:.publishedAt}' \
            > public/app-update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Android APK feed for $RELEASE_TAG"
          git push origin "HEAD:refs/heads/$UPDATE_FEED_BRANCH"
